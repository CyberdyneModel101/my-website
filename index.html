<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian Nielsen | IT, Marketing &amp; AI Specialist</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 24px;
        }

        .domain-headline {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 500;
        }

        .bio {
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 1rem;
            color: var(--text-main);
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
        }

        .skill-tag {
            background-color: rgba(88, 166, 255, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(88, 166, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .links {
            display: flex;
            gap: 16px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0d1117;
        }

        .btn-primary:hover {
            background-color: #79c0ff;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="domain-headline">BrianNielsen.org</h1>
            <p class="subtitle">IT, Marketing &amp; AI Specialist</p>
        </header>

      
  

        <div class="section-title">Core Focus</div>
        <div class="skills-grid">
            <span class="skill-tag">AI Integration &amp; Automation</span>
            <span class="skill-tag">IT Operations</span>
            <span class="skill-tag">Digital Marketing</span>
            <span class="skill-tag">Systems Administration</span>
            <span class="skill-tag">Strategy &amp; Tech Support</span>
        </div>

        <footer>
            &copy; Brian Nielsen. All rights reserved.
        </footer>
    </div>

</body>
</html>
